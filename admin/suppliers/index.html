<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion des Fournisseurs · Administration</title>
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="stylesheet" href="/assets/css/06-components/admin.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="admin-header">
        <div class="admin-title-group">
          <p class="eyebrow">Réseau Professionnel</p>
          <h1>Fournisseurs et Grossistes Documentés</h1>
          <p>Répertoire des grossistes, demi-grossistes et importateurs de la région Souss-Massa.</p>
        </div>
        <div>
          <a href="/admin/suppliers/new.html" class="btn btn-primary">+ Nouveau Fournisseur</a>
        </div>
      </header>

      <nav id="admin-nav" class="admin-nav"></nav>

      <div class="admin-toolbar">
        <input type="search" id="supplier-search" placeholder="Rechercher par nom, ville, type…" style="max-width: 320px;" />
        <span id="supplier-count" style="font-size: 0.85rem; color: var(--muted);">— fournisseurs</span>
      </div>

      <div class="table-wrapper">
        <table class="admin-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nom commercial</th>
              <th>Type d'activité</th>
              <th>Localisation</th>
              <th>Contact / Note</th>
              <th>Offres Référencées</th>
            </tr>
          </thead>
          <tbody id="suppliers-tbody">
            <tr><td colspan="6" style="text-align: center; padding: 24px;">Chargement des fournisseurs…</td></tr>
          </tbody>
        </table>
      </div>
    </main>

    <script type="module">
      import { loadAdminData, renderAdminNav } from '/src/admin.js';

      renderAdminNav('suppliers');

      let allSuppliers = [];
      let offers = [];

      async function init() {
        const data = await loadAdminData();
        allSuppliers = data.suppliers || [];
        offers = data.offers || [];

        renderTable();
        document.getElementById('supplier-search').addEventListener('input', renderTable);
      }

      function renderTable() {
        const query = document.getElementById('supplier-search').value.toLowerCase().trim();
        const filtered = allSuppliers.filter(s =>
          !query ||
          s.name.toLowerCase().includes(query) ||
          (s.location && s.location.toLowerCase().includes(query)) ||
          (s.type && s.type.toLowerCase().includes(query))
        );

        document.getElementById('supplier-count').textContent = `${filtered.length} fournisseur(s)`;
        const tbody = document.getElementById('suppliers-tbody');

        if (!filtered.length) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 20px; color: var(--muted);">Aucun fournisseur correspondant.</td></tr>';
          return;
        }

        tbody.innerHTML = filtered.map(s => {
          const supplierOffers = offers.filter(o => o.supplier_id === s.id);
          return `
            <tr>
              <td><code>${s.id}</code></td>
              <td><strong>${s.name}</strong> ${s._isNew ? '<span class="badge badge-amber">Brouillon</span>' : ''}</td>
              <td><span class="badge badge-green">${s.type || 'Grossiste'}</span></td>
              <td>${s.location || s.city || 'Inezgane'}</td>
              <td>${s.phone || s.contact || '<span style="color: var(--muted);">Non renseigné</span>'}</td>
              <td><strong>${supplierOffers.length}</strong> offre(s)</td>
            </tr>
          `;
        }).join('');
      }

      init();
    </script>
  </body>
</html>
