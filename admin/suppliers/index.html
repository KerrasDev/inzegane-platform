<!--
 * src/admin/suppliers/index.html
 *
 * Inzegane Platform — Admin Suppliers Page
 *
 * This HTML file serves as the admin interface for managing suppliers and wholesalers.
 * It includes a search bar, a table listing suppliers, and a button to add new suppliers.
-->
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion des Fournisseurs · Administration</title>
    <link rel="stylesheet" href="/assets/css/admin.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="admin-header">
        <div class="admin-title-group">
          <p class="eyebrow">Réseau Professionnel</p>
          <h1>Fournisseurs et Grossistes Documentés</h1>
          <p>Répertoire des grossistes, demi-grossistes et importateurs de la région Souss-Massa.</p>
        </div>
        <div>
          <a href="/admin/suppliers/new.html" class="btn btn-primary">+ Nouveau Fournisseur</a>
        </div>
      </header>

      <nav id="admin-nav" class="admin-nav"></nav>

      <div class="admin-toolbar">
        <div class="admin-toolbar-group">
          <input type="search" id="supplier-search" placeholder="Rechercher par nom, ville, type…" style="max-width: 320px;" />
        </div>
        <span id="supplier-count" style="font-size: 0.85rem; color: var(--muted);">— fournisseurs</span>
      </div>

      <div class="table-wrapper">
        <table class="admin-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nom commercial</th>
              <th>Type d'activité</th>
              <th>Localisation</th>
              <th>Contact / Note</th>
              <th>Offres Référencées</th>
            </tr>
          </thead>
          <tbody id="suppliers-tbody">
            <tr><td colspan="6" style="text-align: center; padding: 24px;">Chargement des fournisseurs…</td></tr>
          </tbody>
        </table>
      </div>
    </main>

    <!-- Page Controller Module -->
    <script type="module" src="/src/admin/controllers/suppliers-list-controller.js"></script>
  </body>
</html>
