<!--
 * src/admin/products/index.html
 *
 * Inzegane Platform — Admin Products Page
 *
 * This HTML file serves as the main interface for managing products in the admin panel.
 * It includes a search bar, category filter, and a table that lists all products with
 * their details and actions. The page is dynamically populated using JavaScript.
-->
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion des Produits · Administration</title>
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="stylesheet" href="/assets/css/06-components/admin.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="admin-header">
        <div class="admin-title-group">
          <p class="eyebrow">Répertoire Produits</p>
          <h1>Catalogue des produits documentés</h1>
          <p>Gestion et vérification des fiches techniques et références.</p>
        </div>
        <div>
          <a href="/admin/products/new.html" class="btn btn-primary">+ Nouveau Produit</a>
        </div>
      </header>

      <nav id="admin-nav" class="admin-nav"></nav>

      <div class="admin-toolbar">
        <div class="admin-toolbar-group">
          <input type="search" id="product-search" placeholder="Rechercher par nom, réf…" />
          <select id="category-filter">
            <option value="">Toutes les catégories</option>
          </select>
        </div>
        <span id="product-count" style="font-size: 0.85rem; color: var(--muted);">— produits</span>
      </div>

      <div class="table-wrapper">
        <table class="admin-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nom du produit</th>
              <th>Catégorie</th>
              <th>Référence / Modèle</th>
              <th>Offres Liées</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="products-tbody">
            <tr><td colspan="6" style="text-align: center; padding: 24px;">Chargement des produits…</td></tr>
          </tbody>
        </table>
      </div>
    </main>

    <!-- Page Controller Module -->
    <script type="module" src="/src/admin/controllers/products-list-controller.js"></script>
  </body>
</html>
