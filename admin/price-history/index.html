<!--
 * src/admin/price-history/index.html
 *
 * Inzegane Platform — Admin Price History Page
 *
 * This HTML page displays the historical price observations recorded from wholesalers.
 * It includes a search functionality to filter records by product or supplier.
-->
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Historique des Prix · Administration</title>
    <link rel="stylesheet" href="/assets/css/admin.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="admin-header">
        <div class="admin-title-group">
          <p class="eyebrow">Archives Tarifaires</p>
          <h1>Historique des Prix Observés</h1>
          <p>Chronologie des observations tarifaires relevées auprès des grossistes d'Inezgane.</p>
        </div>
      </header>

      <nav id="admin-nav" class="admin-nav"></nav>

      <div class="admin-toolbar">
        <div class="admin-toolbar-group">
          <input type="search" id="history-search" placeholder="Filtrer par produit ou fournisseur…" style="max-width: 320px;" />
        </div>
        <span id="history-count" style="font-size: 0.85rem; color: var(--muted);">— relevés</span>
      </div>

      <div class="table-wrapper">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Date de Relevé</th>
              <th>Produit</th>
              <th>Fournisseur</th>
              <th>Prix Observé</th>
              <th>Source Documentaire</th>
            </tr>
          </thead>
          <tbody id="history-tbody">
            <tr><td colspan="5" style="text-align: center; padding: 24px;">Chargement de l'historique…</td></tr>
          </tbody>
        </table>
      </div>
    </main>

    <!-- Page Controller Module -->
    <script type="module" src="/src/admin/controllers/price-history-controller.js"></script>
  </body>
</html>
