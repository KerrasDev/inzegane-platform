<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion des Offres · Administration</title>
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="stylesheet" href="/assets/css/06-components/admin.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="admin-header">
        <div class="admin-title-group">
          <p class="eyebrow">Relevés Commerciaux</p>
          <h1>Offres Documentées</h1>
          <p>Prix unitaires observés, conditions de volume et état des vérifications.</p>
        </div>
      </header>

      <nav id="admin-nav" class="admin-nav"></nav>

      <div class="admin-toolbar">
        <div class="admin-toolbar-group">
          <input type="search" id="offer-search" placeholder="Filtrer par produit ou fournisseur…" />
          <select id="status-filter">
            <option value="">Tous les statuts</option>
            <option value="declared_available">Déclaré disponible</option>
            <option value="in_stock">En stock</option>
            <option value="unknown">Indéterminé</option>
          </select>
        </div>
        <span id="offer-count" style="font-size: 0.85rem; color: var(--muted);">— offres</span>
      </div>

      <div class="table-wrapper">
        <table class="admin-table">
          <thead>
            <tr>
              <th>ID Offre</th>
              <th>Produit Référencé</th>
              <th>Fournisseur</th>
              <th>Prix Unitaire</th>
              <th>Quantité Min.</th>
              <th>Statut Déclaré</th>
              <th>Dernière Observation</th>
            </tr>
          </thead>
          <tbody id="offers-tbody">
            <tr><td colspan="7" style="text-align: center; padding: 24px;">Chargement des offres…</td></tr>
          </tbody>
        </table>
      </div>
    </main>

    <script type="module">
      import { loadAdminData, renderAdminNav } from '/src/admin.js';

      renderAdminNav('offers');

      let allOffers = [];
      let productMap = new Map();
      let supplierMap = new Map();

      async function init() {
        const data = await loadAdminData();
        allOffers = data.offers || [];
        productMap = new Map((data.products || []).map(p => [p.id, p.name]));
        supplierMap = new Map((data.suppliers || []).map(s => [s.id, s.name]));

        renderTable();
        document.getElementById('offer-search').addEventListener('input', renderTable);
        document.getElementById('status-filter').addEventListener('change', renderTable);
      }

      function renderTable() {
        const query = document.getElementById('offer-search').value.toLowerCase().trim();
        const selectedStatus = document.getElementById('status-filter').value;

        const filtered = allOffers.filter(o => {
          const prodName = (productMap.get(o.product_id) || '').toLowerCase();
          const suppName = (supplierMap.get(o.supplier_id) || '').toLowerCase();
          const matchQuery = !query || prodName.includes(query) || suppName.includes(query);
          const matchStatus = !selectedStatus || o.availability_status === selectedStatus;
          return matchQuery && matchStatus;
        });

        document.getElementById('offer-count').textContent = `${filtered.length} offre(s)`;
        const tbody = document.getElementById('offers-tbody');

        if (!filtered.length) {
          tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 20px; color: var(--muted);">Aucune offre trouvée.</td></tr>';
          return;
        }

        tbody.innerHTML = filtered.map(o => `
          <tr>
            <td><code>${o.id}</code></td>
            <td><strong>${productMap.get(o.product_id) || o.product_id}</strong></td>
            <td>${supplierMap.get(o.supplier_id) || o.supplier_id}</td>
            <td><strong style="color: var(--green-950);">${o.price} ${o.currency || 'MAD'}</strong></td>
            <td>${o.min_quantity ? `${o.min_quantity} unité(s)` : '1'}</td>
            <td><span class="badge ${o.availability_status === 'in_stock' || o.availability_status === 'declared_available' ? 'badge-green' : 'badge-amber'}">${o.availability_status || 'observé'}</span></td>
            <td>${o.verified_at ? new Date(o.verified_at).toLocaleDateString('fr-FR') : '—'}</td>
          </tr>
        `).join('');
      }

      init();
    </script>
  </body>
</html>
