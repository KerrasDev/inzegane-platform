<!--
 * admin/offers/index.html
 *
 * Inzegane Platform — Admin Offers Page
 *
 * This HTML page serves as the administrative interface for managing documented offers.
 * It provides a searchable and filterable table of offers, displaying key information
 * such as product references, suppliers, unit prices, minimum quantities, declared statuses,
 * and the last observation date. The page is designed to facilitate efficient offer management
 * for administrators.
-->
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion des Offres · Administration</title>
    <link rel="stylesheet" href="/assets/css/admin.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="admin-header">
        <div class="admin-title-group">
          <p class="eyebrow">Relevés Commerciaux</p>
          <h1>Offres Documentées</h1>
          <p>Prix unitaires observés, conditions de volume et état des vérifications.</p>
        </div>
      </header>

      <nav id="admin-nav" class="admin-nav"></nav>

      <div class="admin-toolbar">
        <div class="admin-toolbar-group">
          <input type="search" id="offer-search" placeholder="Filtrer par produit ou fournisseur…" />
          <select id="status-filter">
            <option value="">Tous les statuts</option>
            <option value="in_stock">En stock / Disponible</option>
            <option value="low_stock">Stock faible</option>
            <option value="available_on_order">Sur commande</option>
            <option value="out_of_stock">Épuisé</option>
            <option value="unknown">Indéterminé</option>
          </select>
        </div>
        <span id="offer-count" style="font-size: 0.85rem; color: var(--muted);">— offres</span>
      </div>

      <div class="table-wrapper">
        <table class="admin-table">
          <thead>
            <tr>
              <th>ID Offre</th>
              <th>Produit Référencé</th>
              <th>Fournisseur</th>
              <th>Prix Unitaire</th>
              <th>Quantité Min.</th>
              <th>Statut Déclaré</th>
              <th>Dernière Observation</th>
            </tr>
          </thead>
          <tbody id="offers-tbody">
            <tr><td colspan="7" style="text-align: center; padding: 24px;">Chargement des offres…</td></tr>
          </tbody>
        </table>
      </div>
    </main>

    <!-- Page Controller Module -->
    <script type="module" src="/src/admin/controllers/offers-list-controller.js"></script>
  </body>
</html>
