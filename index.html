<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Catalogue de recherche des produits électroniques et offres de gros documentés pour Inezgane et la région Souss-Massa."
    />
    <title>Marché de gros · Inezgane</title>
    <link rel="stylesheet" href="/assets/css/main.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="masthead">
        <p class="eyebrow">Répertoire de recherche · Souss-Massa</p>
        <h1>Marché de gros <span>à Inezgane</span></h1>
        <p class="intro">Produits, fournisseurs et dernières observations disponibles dans le dossier de recherche.</p>
      </header>

      <section id="load-status" class="load-status" role="status" aria-live="polite">
        Chargement du catalogue…
      </section>

      <form id="search-form" class="filters" role="search">
        <label class="search-field" for="search-query">
          <span>Rechercher</span>
          <input id="search-query" name="q" type="search" placeholder="Produit, marque, référence…" autocomplete="off" />
        </label>
        <label for="category-filter">
          <span>Catégorie</span>
          <select id="category-filter" name="category">
            <option value="">Toutes les catégories</option>
          </select>
        </label>
        <label for="brand-filter">
          <span>Marque</span>
          <select id="brand-filter" name="brand">
            <option value="">Toutes les marques</option>
          </select>
        </label>
        <label for="supplier-filter">
          <span>Fournisseur</span>
          <select id="supplier-filter" name="supplier">
            <option value="">Tous les fournisseurs</option>
          </select>
        </label>
        <label for="condition-filter">
          <span>État</span>
          <select id="condition-filter" name="condition">
            <option value="">Tous les états</option>
          </select>
        </label>
        <label for="freshness-filter">
          <span>Vérification des offres</span>
          <select id="freshness-filter" name="freshness">
            <option value="">Toutes les dates</option>
          </select>
        </label>
        <label for="stock-filter">
          <span>Disponibilité déclarée</span>
          <select id="stock-filter" name="stock">
            <option value="">Tous les statuts</option>
          </select>
        </label>
        <label for="sort-order">
          <span>Trier par</span>
          <select id="sort-order" name="sort">
            <option value="name">Nom</option>
            <option value="price">Prix observé le plus récemment</option>
            <option value="verified">Offre vérifiée le plus récemment</option>
          </select>
        </label>
      </form>

      <section class="catalog" aria-labelledby="catalog-heading">
        <div class="catalog-heading">
          <h2 id="catalog-heading">Catalogue documenté</h2>
          <p id="result-summary" aria-live="polite"></p>
        </div>
        <div id="results" class="product-grid" aria-live="polite"></div>
        <nav id="page-controls" class="page-controls" aria-label="Pagination"></nav>
      </section>

      <footer class="footer">
        <p>Les données reflètent le document source, pas une disponibilité commerciale en temps réel.</p>
      </footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
