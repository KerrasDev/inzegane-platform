<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The requested page could not be found." />
    <meta name="robots" content="noindex" />
    <title>Page not found · Inzegane Platform</title>
    <link rel="stylesheet" href="/assets/css/public.css" />
  </head>
  <body data-nav="">
    <main id="main-content" class="page-shell page-main" tabindex="-1">
      <section class="empty-state" aria-labelledby="not-found-heading">
        <p class="eyebrow">Error 404</p>
        <h1 id="not-found-heading" class="page-title">Page not found</h1>
        <p class="page-intro">The page or resource you requested could not be found. The link may be out of date, or the address may contain a typo.</p>
        <form class="filters filters--compact content-section" role="search" action="/pages/products/" method="get" aria-label="Search products">
          <label class="search-field" for="not-found-search">
            <span>Search products instead</span>
            <input id="not-found-search" name="q" type="search" placeholder="Product, brand, model…" autocomplete="off" />
          </label>
          <div class="filters__actions">
            <button class="button" type="submit">Search</button>
          </div>
        </form>
        <p class="button-row">
          <a class="button button--secondary" href="/">Go to the homepage</a>
          <a class="button button--secondary" href="/pages/products/">Browse products</a>
          <a class="button button--secondary" href="/pages/categories/">Browse categories</a>
        </p>
      </section>
    </main>
    <noscript>
      <p class="page-shell callout callout--warning">Navigation and catalog data on this site need JavaScript. <a href="/">Go to the homepage</a>.</p>
    </noscript>
    <script type="module" src="/src/public/pages/static-page.js"></script>
  </body>
</html>
